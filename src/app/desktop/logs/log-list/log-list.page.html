<ion-header [translucent]="true">
  <ion-toolbar class="brand-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/desktop/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Logs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="logs-content">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="search-bar">
    <ion-icon name="search-outline" class="search-icon"></ion-icon>
    <input
      type="text"
      placeholder="Search by user, event, or device..."
      [value]="searchTerm"
      (input)="onSearch($any($event.target).value)"
      class="search-input"
    />
  </div>

  <div class="stat-card" *ngIf="!isLoading && !errorMessage">
    <div class="stat-icon"><ion-icon name="document-text-outline"></ion-icon></div>
    <div class="stat-body">
      <span class="stat-value">{{ filteredLogs.length }}</span>
      <span class="stat-label">Access events</span>
    </div>
  </div>

  <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="state-message" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="state-message" *ngIf="!isLoading && filteredLogs.length === 0">
    <ion-icon name="document-text-outline"></ion-icon>
    <p>No logs found.</p>
  </div>

  <div class="log-card" *ngIf="!isLoading && filteredLogs.length">
    <div class="log-row" *ngFor="let log of filteredLogs">
      <div class="log-icon-wrap" [ngClass]="eventTone(log.eventType)">
        <ion-icon name="finger-print-outline"></ion-icon>
      </div>
      <div class="log-body">
        <span class="log-title">
          <ng-container *ngIf="log.userName; else unknownUser">{{ log.userName }} · {{ log.eventType }}</ng-container>
          <ng-template #unknownUser>{{ log.eventType }}</ng-template>
        </span>
        <span class="log-sub">{{ log.deviceName }}</span>
      </div>
      <span class="log-time">{{ log.timestamp | date: 'short' }}</span>
    </div>
  </div>
</ion-content>
